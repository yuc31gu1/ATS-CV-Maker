[project]
name = "ats-cv-backend"
version = "0.1.0"
description = "ATS CV Maker backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "psycopg[binary]",
    "pydantic-settings",
    "alembic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "testcontainers[postgres]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: tests requiring Docker/Testcontainers"]

[tool.ruff]
line-length = 100